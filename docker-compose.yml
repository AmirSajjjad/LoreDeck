name: ${COMPOSE_PROJECT_NAME:-loredeck}

x-game-image: &game-image
  image: loredeck-game:${IMAGE_TAG:-latest}
  build:
    context: ./apps/backend
    dockerfile: Dockerfile

x-game-environment: &game-environment
  LOREDECK_DATABASE_HOST: postgres
  LOREDECK_DATABASE_PORT: "5432"
  LOREDECK_DATABASE_NAME: ${POSTGRES_DB:-loredeck}
  LOREDECK_DATABASE_USER: ${POSTGRES_USER:-loredeck}
  LOREDECK_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  LOREDECK_DATABASE_DRIVER: postgresql+asyncpg
  LOREDECK_DATABASE_ECHO: "false"
  LOREDECK_DEBUG: "false"
  LOREDECK_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:8080}
  LOREDECK_CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-*}
  LOREDECK_CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-*}
  LOREDECK_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  LOREDECK_JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  LOREDECK_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loredeck}
      POSTGRES_USER: ${POSTGRES_USER:-loredeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  migrate:
    <<: *game-image
    command: ["/app/.venv/bin/alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment: *game-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  backend:
    <<: *game-image
    environment: *game-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - app

  frontend:
    image: loredeck-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
