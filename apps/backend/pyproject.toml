[project]
name = "loredeck-backend"
version = "0.1.0"
description = "Python backend services for LoreDeck"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.10",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.35",
    "asyncpg>=0.31.0",
    "openai>=3.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loredeck"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["loredeck"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "src",
    "tests",
]
exclude = [
    ".venv",
    "alembic/versions",
]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: tests that require external infrastructure",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["loredeck"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
]
